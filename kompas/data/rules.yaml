# Правила плана «первые 30 дней».
# Сроки считает код (kompas/plan.py), а не языковая модель.
# kind: legal — срок установлен законом; recommended — рекомендуемый срок команды Компаса.
# Перед пилотом каждое правило сверяется с международным отделом вуза и юристом банка.

groups:
  eaeu: [KZ, KG, AM, BY]   # страны ЕАЭС
  visa_free_cis: [UZ, TJ, AZ, MD]

steps:
  - id: migration_registration
    order: 1
    kind: legal
    days: 7
    business_days: true
    days_by_group: {eaeu: 30}
    skip_for: []
    title:
      ru: Встать на миграционный учёт
      en: Migration registration
      zh: 办理移民登记（落地登记）
    hint:
      ru: Обычно учёт оформляет вуз или общежитие как принимающая сторона. Отдайте паспорт и миграционную карту в международный отдел в день заселения.
      en: Usually the university or dormitory registers you as the host party. Bring your passport and migration card to the international office on move-in day.
      zh: 通常由大学或宿舍作为接收方为您办理登记。入住当天请将护照和移民卡交给国际处。
    source: https://www.consultant.ru/document/cons_doc_LAW_61569/
    kb: migration_registration

  - id: medical_exam
    order: 2
    kind: legal
    days: 30
    skip_for: [BY]
    title:
      ru: Медосвидетельствование, дактилоскопия и фото
      en: Medical examination, fingerprinting and photo
      zh: 体检、指纹采集和拍照
    hint:
      ru: Обязательно, если вы в России больше 90 дней. Просрочка грозит сокращением срока пребывания.
      en: Mandatory if you stay in Russia for more than 90 days. Missing the deadline may shorten your permitted stay.
      zh: 在俄罗斯停留超过90天必须办理。逾期可能导致停留期限被缩短。
    source: https://spb.hse.ru/io/medexam
    kb: medical_exam

  - id: dms
    order: 3
    kind: recommended
    days: 5
    skip_for: []
    title:
      ru: Оформить полис ДМС
      en: Get voluntary medical insurance (DMS)
      zh: 办理自愿医疗保险（DMS）
    hint:
      ru: Полис понадобится для медосвидетельствования и визитов к врачу. Многие вузы оформляют его сами — уточните в международном отделе.
      en: You will need it for the medical exam and doctor visits. Many universities arrange it — ask the international office.
      zh: 体检和就医都需要保险单。许多大学会统一办理——请咨询国际处。
    source: https://www.gosuslugi.ru/
    kb: dms

  - id: sim_gosuslugi
    order: 4
    kind: recommended
    days: 7
    skip_for: []
    title:
      ru: SIM-карта и подтверждённая учётная запись Госуслуг
      en: SIM card and a verified Gosuslugi account
      zh: 办理SIM卡并验证国家服务门户（Gosuslugi）账户
    hint:
      ru: С 2025 года иностранцу для SIM-карты и Госуслуг нужна биометрия. Без них сложно открыть счёт и получить СНИЛС.
      en: Since 2025 foreigners need biometrics for a SIM card and Gosuslugi. Without them it is hard to open a bank account or get SNILS.
      zh: 自2025年起，外国人办理SIM卡和国家服务门户需要生物识别。没有它们，开立银行账户和办理SNILS会很困难。
    source: https://ppt.ru/news/inostrannye-grazhdane/do-1-iyulya-migranty-dolzhny-sdat-biometriyu-inache-ostanutsya-bez-telefonnoy-svyazi
    kb: sim_biometrics

  - id: bank_card
    order: 5
    kind: recommended
    days: 3
    skip_for: []
    title:
      ru: Получить банковскую карту и подключить СБП
      en: Get a bank card and connect SBP (Fast Payment System)
      zh: 办理银行卡并开通快速支付系统（СБП）
    hint:
      ru: Visa и Mastercard зарубежных банков в России не работают. Компас подготовит список документов и запишет в отделение рядом с вузом.
      en: Foreign Visa and Mastercard cards do not work in Russia. Kompas prepares your document list and books a branch visit near campus.
      zh: 外国银行的Visa和Mastercard在俄罗斯无法使用。Kompas会为您准备材料清单并预约学校附近的网点。
    source: https://ppt.ru/columns/rosco/kak-inostrantsu-otkryt-schet-v-rossiyskom-banke
    kb: bank_account

  - id: snils
    order: 6
    kind: recommended
    days: 30
    skip_for: []
    title:
      ru: Получить СНИЛС
      en: Get SNILS (insurance number)
      zh: 办理SNILS（个人保险账号）
    hint:
      ru: СНИЛС нужен для Госуслуг, работы и в ряде банков. Оформляется в Социальном фонде.
      en: SNILS is needed for Gosuslugi, employment and by some banks. Issued by the Social Fund.
      zh: 国家服务门户、工作以及部分银行都需要SNILS。由社会基金办理。
    source: https://sfr.gov.ru/
    kb: snils
