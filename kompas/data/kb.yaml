# Проверенная база знаний Компаса.
# Помощник отвечает ТОЛЬКО по этим карточкам и всегда даёт ссылку на источник.
# Каждая карточка: id, ключевые слова для поиска (на всех языках), текст ответа на ru/en/zh, источник, дата проверки.

cards:
  - id: migration_registration
    checked: 2026-11-01
    source: https://www.consultant.ru/document/cons_doc_LAW_61569/
    keywords: миграционный учёт регистрация учет прописка принимающая сторона registration migration register 登记 落地 移民登记 注册
    ru: >-
      Миграционный учёт — постановка на учёт по месту пребывания. Для студента в общежитии это обычно делает вуз как
      принимающая сторона в течение 7 рабочих дней со дня прибытия. Граждане стран ЕАЭС (Казахстан, Кыргызстан, Армения,
      Беларусь) могут находиться без учёта до 30 дней. Отдайте паспорт и миграционную карту в международный отдел в день заселения
      и сохраните отрывной талон уведомления.
    en: >-
      Migration registration means registering at your place of stay. For dormitory students the university usually does it as
      the host party within 7 working days of arrival. Citizens of EAEU countries (Kazakhstan, Kyrgyzstan, Armenia, Belarus) may stay
      up to 30 days without registration. Give your passport and migration card to the international office on move-in day and keep
      the tear-off notification slip.
    zh: >-
      移民登记是指在居住地进行登记。住宿舍的学生通常由大学作为接收方在抵达后7个工作日内办理。欧亚经济联盟国家（哈萨克斯坦、吉尔吉斯斯坦、
      亚美尼亚、白俄罗斯）公民可在30天内免登记。入住当天请将护照和移民卡交给国际处，并保存好登记回执联。

  - id: medical_exam
    checked: 2026-11-01
    source: https://spb.hse.ru/io/medexam
    keywords: медосвидетельствование медкомиссия дактилоскопия отпечатки фото медицинское освидетельствование medical exam fingerprint fingerprinting 体检 指纹 拍照
    ru: >-
      Если вы находитесь в России больше 90 дней, в течение 30 дней со дня въезда нужно пройти медосвидетельствование,
      дактилоскопию и фотографирование. Дактилоскопия проходится один раз, медосвидетельствование — ежегодно.
      Граждане Беларуси освобождены. При просрочке могут сократить срок пребывания.
    en: >-
      If you stay in Russia for more than 90 days, within 30 days of entry you must complete a medical examination,
      fingerprinting and photographing. Fingerprinting is done once, the medical exam yearly. Citizens of Belarus are exempt.
      Missing the deadline may shorten your permitted stay.
    zh: >-
      如果您在俄罗斯停留超过90天，须在入境后30天内完成体检、指纹采集和拍照。指纹只需采集一次，体检每年一次。白俄罗斯公民免除。
      逾期可能导致允许停留期限被缩短。

  - id: dms
    checked: 2026-11-01
    source: https://www.gosuslugi.ru/
    keywords: дмс страховка полис медицинская страховка insurance dms policy 保险 医疗保险 保单
    ru: >-
      Полис добровольного медицинского страхования (ДМС) нужен иностранному студенту для медосвидетельствования и обращения к врачу.
      Многие вузы оформляют его централизованно — уточните в международном отделе, прежде чем покупать полис самостоятельно.
    en: >-
      A voluntary medical insurance (DMS) policy is required for the medical exam and doctor visits. Many universities arrange it
      centrally — check with the international office before buying one yourself.
    zh: >-
      外国留学生体检和就医都需要自愿医疗保险（DMS）保单。许多大学会统一办理——自行购买前请先咨询国际处。

  - id: sim_biometrics
    checked: 2026-11-01
    source: https://ppt.ru/news/inostrannye-grazhdane/do-1-iyulya-migranty-dolzhny-sdat-biometriyu-inache-ostanutsya-bez-telefonnoy-svyazi
    keywords: sim сим симкарта сим-карта телефон номер биометрия госуслуги gosuslugi biometrics phone number 手机卡 电话卡 生物识别 国家服务
    ru: >-
      С 2025 года иностранному гражданину для использования российской SIM-карты нужно подтвердить номер через учётную запись
      на Госуслугах, а для подтверждения учётной записи — сдать биометрию. Без рабочей SIM-карты и Госуслуг трудно открыть
      банковский счёт и получить СНИЛС, поэтому этот шаг лучше сделать в первую неделю.
    en: >-
      Since 2025 a foreign citizen must confirm a Russian SIM number via a Gosuslugi account, and verifying that account requires
      biometrics. Without a working SIM and Gosuslugi it is hard to open a bank account and get SNILS, so do this in your first week.
    zh: >-
      自2025年起，外国公民使用俄罗斯SIM卡须通过国家服务门户（Gosuslugi）账户确认号码，而验证账户需要录入生物识别信息。
      没有可用的SIM卡和Gosuslugi账户，很难开立银行账户和办理SNILS，因此建议在第一周内完成。

  - id: bank_account
    checked: 2026-11-01
    source: https://ppt.ru/columns/rosco/kak-inostrantsu-otkryt-schet-v-rossiyskom-banke
    keywords: карта банк счёт счет открыть карту документы visa mastercard сбп bank card account documents sbp 银行卡 开户 银行 账户 材料
    ru: >-
      Карты Visa и Mastercard зарубежных банков в России не работают, поэтому нужна карта российского банка.
      Для открытия счёта обычно нужны: паспорт с нотариальным переводом, миграционная карта, виза (если нужна),
      уведомление о миграционном учёте, российский номер телефона; часто — подтверждённые Госуслуги и СНИЛС.
      Компас соберёт персональный список документов; в пилоте — запись в отделение банка-партнёра рядом с вузом.
    en: >-
      Visa and Mastercard cards issued abroad do not work in Russia, so you need a Russian bank card. To open an account you usually
      need: passport with a notarised translation, migration card, visa (if required), migration registration slip and a Russian phone
      number; often also a verified Gosuslugi account and SNILS. Kompas builds your personal checklist; in the pilot it also books a visit to a partner bank branch near campus.
    zh: >-
      外国银行发行的Visa和Mastercard在俄罗斯无法使用，因此需要俄罗斯银行卡。开户通常需要：带公证翻译的护照、移民卡、签证（如需要）、
      移民登记回执、俄罗斯手机号；常常还需要已验证的Gosuslugi账户和SNILS。Kompas会为您生成个人材料清单；试点阶段还可预约学校附近合作银行的网点。

  - id: transfer_from_home
    checked: 2026-11-01
    source: https://vc.ru/money/2724044-perevody-iz-kitaya-v-rossiyu
    keywords: перевод деньги из дома родители заблокирован задержали задержка юани китай transfer money from home parents blocked delayed china yuan 汇款 转账 父母 被冻结 退回 人民币 中国
    ru: >-
      Переводы из-за рубежа, в том числе из Китая, сейчас могут задерживаться или возвращаться: банки-отправители проверяют
      платежи в Россию из-за санкционных рисков. Что делать законно: попросить родителей отправлять перевод в национальной валюте
      через банк, который работает с Россией; указывать понятное назначение платежа («на обучение/проживание студента ФИО»);
      сохранять договор с вузом. Банк может запросить документы о происхождении средств — это стандартная проверка.
      Компас никогда не подсказывает способы обойти проверки.
    en: >-
      Transfers from abroad, including from China, may currently be delayed or returned: sending banks screen payments to Russia
      because of sanctions risks. Legal steps: ask your parents to send in national currency via a bank that works with Russia; use a
      clear payment purpose ("tuition/living expenses of student NAME"); keep your university contract. The bank may ask for documents
      on the source of funds — this is a standard check. Kompas never suggests ways to bypass checks.
    zh: >-
      目前从国外（包括中国）汇往俄罗斯的款项可能被延迟或退回：由于制裁风险，汇出银行会审查汇往俄罗斯的付款。合法做法：请父母通过
      与俄罗斯有业务往来的银行以本国货币汇款；写明清楚的用途（"学生某某的学费/生活费"）；保留与大学的合同。银行可能要求提供资金
      来源证明——这是标准审查。Kompas绝不提供规避审查的方法。

  - id: snils
    checked: 2026-11-01
    source: https://sfr.gov.ru/
    keywords: снилс страховой номер соцфонд snils insurance number social fund 社保号 保险号码 社会基金
    ru: >-
      СНИЛС — страховой номер индивидуального лицевого счёта. Иностранцу он нужен для Госуслуг, официальной работы и в ряде банков.
      Оформить можно в клиентской службе Социального фонда России с паспортом и миграционными документами.
    en: >-
      SNILS is the individual insurance account number. Foreigners need it for Gosuslugi, official employment and at some banks.
      Apply at a Social Fund of Russia office with your passport and migration documents.
    zh: >-
      SNILS是个人保险账户号码。外国人办理Gosuslugi、正式就业以及在部分银行办理业务时需要它。可携带护照和移民文件到俄罗斯社会基金服务处办理。

  - id: fraud
    checked: 2026-11-01
    source: https://fincult.info/
    keywords: мошенники мошенничество звонок код смс безопасный счёт полиция обман fraud scam call code sms safe account 诈骗 骗子 电话 验证码 安全账户
    ru: >-
      Настоящий банк никогда не просит назвать код из SMS, данные карты или перевести деньги на «безопасный счёт».
      Мошенники часто звонят иностранцам от имени банка, полиции или миграционной службы и торопят. Положите трубку и
      сами позвоните в банк по номеру на обороте карты. Если сомневаетесь — спросите Компас «Это правда банк?».
    en: >-
      A real bank never asks for an SMS code, your card details or a transfer to a "safe account". Scammers often call foreigners
      pretending to be the bank, police or migration service and rush you. Hang up and call your bank using the number on the back
      of your card. If in doubt, ask Kompas "Is this really the bank?".
    zh: >-
      真正的银行绝不会要求您提供短信验证码、银行卡信息或把钱转到"安全账户"。骗子常冒充银行、警察或移民局给外国人打电话并催促您。
      请立即挂断，并拨打银行卡背面的号码联系银行。如有疑问，请问Kompas"这真的是银行吗？"。
