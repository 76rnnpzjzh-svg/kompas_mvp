<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Компас — первые 30 дней в России</title>
<style>
  :root{--navy:#0a1f5c;--blue:#006cf0;--sky:#4da8ff;--ice:#e6f1ff;--card:#f4f5f7;--txt:#262626;--muted:#6b7280;
        --green:#1e8e4e;--amber:#c77c00;--red:#c63b2f;--bg:#ffffff}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--txt);background:var(--bg)}
  header{background:linear-gradient(120deg,#cfe6ff,#4da8ff 55%,#006cf0);color:#fff;padding:20px 16px}
  .wrap{max-width:1120px;margin:0 auto;padding:0 16px}
  header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{margin:0;font-size:26px;letter-spacing:.5px}
  header p{margin:4px 0 0;opacity:.95;font-size:14px}
  .langs button{border:1px solid rgba(255,255,255,.7);background:transparent;color:#fff;border-radius:999px;padding:6px 12px;margin-left:6px;cursor:pointer;font-size:13px}
  .langs button.on{background:#fff;color:var(--navy);font-weight:600}
  main{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:20px 16px 40px}
  @media (max-width:820px){main{grid-template-columns:1fr}}
  section{background:var(--card);border-radius:16px;padding:18px}
  h2{margin:0 0 12px;font-size:18px;color:var(--navy)}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  select,input[type=date],input[type=text]{width:100%;padding:10px 12px;border:1px solid #d6dbe3;border-radius:10px;font:inherit;background:#fff}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}
  .btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
  .steps{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:10px}
  .step{background:#fff;border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
  .step input{margin-top:3px;width:18px;height:18px;accent-color:var(--green)}
  .step.done .t{text-decoration:line-through;color:var(--muted)}
  .t{font-weight:600;color:var(--navy)}
  .meta{grid-column:2;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px}
  .pill{border-radius:999px;padding:2px 8px;font-weight:600;font-size:11px;color:#fff}
  .legal{background:var(--red)}.rec{background:var(--sky)}
  .due{font-weight:600}
  .hint{grid-column:2;font-size:13px;color:#444;line-height:1.4}
  .links{grid-column:2;font-size:12px}
  .links a{color:var(--blue);margin-right:12px;cursor:pointer;text-decoration:none}
  .bank{background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;margin-top:12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .bank .btn{background:#fff;color:var(--navy)}
  #chat{background:#fff;border-radius:12px;height:430px;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:88%;padding:10px 12px;border-radius:12px;font-size:14px;line-height:1.45;white-space:pre-wrap}
  .me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
  .bot{align-self:flex-start;background:var(--ice);border-bottom-left-radius:4px}
  .bot.warn{background:#fff3e0}
  .src{display:block;margin-top:6px;font-size:12px}
  .src a{color:var(--blue);word-break:break-all}
  .tag{display:inline-block;margin-top:6px;font-size:11px;color:var(--muted)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
  .chip{background:#fff;border:1px solid #d6dbe3;border-radius:999px;padding:6px 10px;font-size:12px;cursor:pointer}
  form.ask{display:flex;gap:8px;margin-top:10px}
  footer{font-size:12px;color:var(--muted);padding:0 16px 30px}
</style>
</head>
<body>
<header><div class="wrap">
  <div><h1>КОМПАС</h1><p data-i="tagline"></p></div>
  <div class="langs"><button data-l="ru">RU</button><button data-l="en">EN</button><button data-l="zh">中文</button></div>
</div></header>

<main class="wrap">
  <section>
    <h2 data-i="planTitle"></h2>
    <div class="row">
      <div><label data-i="country"></label>
        <select id="country">
          <option value="CN">中国 / Китай</option><option value="KZ">Қазақстан / Казахстан</option>
          <option value="UZ">O‘zbekiston / Узбекистан</option><option value="TJ">Тоҷикистон / Таджикистан</option>
          <option value="KG">Кыргызстан</option><option value="BY">Беларусь</option>
          <option value="VN">Việt Nam / Вьетнам</option><option value="NG">Nigeria / Нигерия</option>
          <option value="ML">Mali / Мали</option><option value="IN">India / Индия</option><option value="">—</option>
        </select></div>
      <div><label data-i="entry"></label><input type="date" id="entry"></div>
    </div>
    <p class="note" data-i="privacy"></p>
    <button class="btn" id="build" data-i="build"></button>
    <ul class="steps" id="steps"></ul>
    <div class="bank" id="bank" hidden><span data-i="bankText"></span><button class="btn" id="bankBtn" data-i="bankBtn"></button></div>
  </section>

  <section>
    <h2 data-i="chatTitle"></h2>
    <div id="chat"></div>
    <div class="chips" id="chips"></div>
    <form class="ask" id="askForm"><input type="text" id="q" autocomplete="off"><button class="btn" data-i="send"></button></form>
    <p class="note" data-i="chatNote"></p>
  </section>
</main>
<footer class="wrap" data-i="footer"></footer>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
